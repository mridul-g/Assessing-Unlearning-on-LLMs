# @package eval.tofu.metrics.mia_gradnorm
defaults:
  - ../../data/datasets@datasets: TOFU_Forget_Retain
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: mia_gradnorm
batch_size: 1
p: 2
checkpoint_every_n_batches: 500
checkpoint_dir: ${eval.tofu.output_dir}/checkpoints/mia_gradnorm

datasets:
  TOFU_QA_forget:
    args:
      hf_args:
        name: ${eval.tofu.forget_split}
      question_key: ${eval.tofu.question_key}
  TOFU_QA_holdout:
    args:
      hf_args:
        name: ${eval.tofu.holdout_split}
      question_key: ${eval.tofu.question_key}
  TOFU_QA_retain:
    args:
      hf_args:
        name: ${eval.tofu.retain_split}
      question_key: ${eval.tofu.question_key}