# @package eval.tofu.metrics.mia_min_k_plus_plus
defaults:
  - ../../data/datasets@datasets: TOFU_Forget_Retain
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex
batch_size: ${eval.tofu.batch_size}
k: 0.4
handler: mia_min_k_plus_plus

datasets:
  TOFU_QA_forget:
    args:
      hf_args:
        name: ${eval.tofu.forget_split}
      question_key: ${eval.tofu.question_key}
  TOFU_QA_holdout:
    args:
      hf_args:
        name: ${eval.tofu.holdout_split}
      question_key: ${eval.tofu.question_key}
  TOFU_QA_retain:
    args:
      hf_args:
        name: ${eval.tofu.retain_split}
      question_key: ${eval.tofu.question_key}