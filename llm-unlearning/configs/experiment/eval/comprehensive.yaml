# @package _global_

defaults:
  - override /eval/tofu/tofu_metrics:
    - forget_Truth_Ratio
    - forget_quality
    - forget_Q_A_Prob
    - forget_Q_A_ROUGE
    - model_utility
    - privleak
    - extraction_strength
    - exact_memorization
    - mia_gradnorm
  - override /eval/muse/muse_metrics:
    - forget_knowmem_ROUGE
    - retain_knowmem_ROUGE
    - forget_verbmem_ROUGE
    - privleak
    - extraction_strength
    - exact_memorization
    - mia_gradnorm

eval:
  tofu:
    metrics:
      exact_memorization:
        batch_size: 1
      mia_gradnorm:
        p: 2
  muse:
    metrics:
      exact_memorization:
        batch_size: 1
      mia_gradnorm:
        p: 2
